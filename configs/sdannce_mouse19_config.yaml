### s-DANNCE mouse19 configuration ###

### basic ###
io_config: io.yaml
camnames: ['Camera1', 'Camera2', 'Camera3']
n_instances: 1
random_seed: 1024

### data ###
# Update crop sizes to match your calibration/image dimensions
crop_height: [0, 720]
crop_width: [0, 1280]

# volumetric representation
vmin: -120
vmax: 120
nvox: 80
interp: nearest

unlabeled_sampling: equal
COM_augmentation: False

### train ###
batch_size: 4
epochs: 2
lr: 0.0001
train_mode: finetune
# Update finetune weights path as needed
dannce_finetune_weights: ./DANNCE/train00/checkpoint-epoch2.pth

num_validation_per_exp: 50
save_period: 1
data_split_seed: 1024
num_train_per_exp: 10000

lr_scheduler:
  type: MultiStepLR
  args:
    milestones: [20, 35]
    gamma: 0.5

### architecture ###
expval: True
net_type: dannce
n_channels_in: 3
n_channels_out: 19
new_n_channels_out: 19
n_views: 3
multi_gpu_train: False
gpu_id: [0, 1, 2, 3]

graph_cfg:
    model: PoseGCN
    n_instances: 1
    hidden_dim: 128
    n_layers: 3
    dropout: 0.2
    use_residual: False
    predict_diff: True
    use_features: True
    fuse_dim: 128

### loss ###
metric: ['euclidean_distance_3D']
loss:
    L1Loss:
      loss_weight: 1.0
    BoneLengthLoss:
      loss_weight: 0.5
      compute_priors_from_data: True
      body_profile: mouse19
      mask: [2]
      relative_scale: True
      ref_loss_weight: 0.0
    ConsistencyLoss:
      copies_per_sample: 4
      loss_weight: 0.1

### data augmentation ###
medfilt_window: 30
rand_view_replace: True
n_rand_views: 3
mirror_augmentation: True
left_keypoints: [1, 7, 8, 9, 13, 14, 15]
right_keypoints: [2, 10, 11, 12, 16, 17, 18]

augment_hue: False
augment_brightness: False
augment_bright_val: 0.01

### skeleton ###
skeleton: mouse19
body_profile: mouse19

### predictions ###
max_num_samples: max
