### s-DANNCE Configuration with 2D Training and Confidence Weighting ###

### basic ###
io_config: io.yaml
camnames: ['Camera1', 'Camera2', 'Camera3', 'Camera4', 'Camera5', 'Camera6']
n_instances: 2
random_seed: 1024

### data ###
crop_height: [0, 1200]
crop_width: [0, 1920]

# volumetric representation
vmin: -120
vmax: 120
nvox: 80
interp: nearest

unlabeled_sampling: equal
COM_augmentation: True

### train ###
batch_size: 4
epochs: 40
lr: 0.0001
train_mode: new

num_validation_per_exp: 4
save_period: 5
data_split_seed: 1024

lr_scheduler:
  type: MultiStepLR
  args: 
    milestones: [20, 35]
    gamma: 0.5

### architecture ###
expval: True
net_type: "compressed_dannce"
n_channels_in: 3
n_channels_out: 23
new_n_channels_out: 23
n_views: 6

graph_cfg:
    model: PoseGCN
    n_instances: 1
    hidden_dim: 128
    n_layers: 3
    dropout: 0.2
    use_residual: False
    predict_diff: True
    use_features: True
    fuse_dim: 128

### 2D Training Configuration ###
# Enable 2D reprojection training alongside 3D training
train_on_2d: True

# 2D Loss Configuration
loss:
    L1Loss: 
      loss_weight: 1.0
    BoneLengthLoss:
      loss_weight: 0.5
      priors: ../priors/rat23_limb_length_priors.npy
      body_profile: rat23
      mask: [2]
      relative_scale: True
      ref_loss_weight: 0.0
    ConsistencyLoss:
      copies_per_sample: 4
      loss_weight: 0.1

# Dedicated 2D loss configuration (optional - separate from 3D losses)
loss_2d:
    CharbonnierLoss:
      loss_weight: 0.5
      epsilon: 1e-3

### 2D Confidence Weighting Configuration ###
# Enable confidence-based loss weighting
use_2d_confidence_weighting: True

# Minimum confidence threshold - keypoints below this get very low weight
min_confidence_threshold: 0.3

# Confidence weighting method: 'linear', 'sigmoid', 'exponential'
confidence_loss_weighting_method: 'sigmoid'

# Confidence weighting strength (higher = more influence)
confidence_weighting_strength: 1.5

# Per-camera loss weights (optional - can weight different cameras differently)
per_camera_2d_loss_weights:
    Camera1: 1.0
    Camera2: 1.0
    Camera3: 0.8  # Lower weight for potentially occluded views
    Camera4: 0.8
    Camera5: 1.0
    Camera6: 1.0

### 2D Loss Stability Parameters ###
clip_2d_loss: True
max_2d_loss_value: 70.0
clip_projections: True
max_projection_coord: 5000.0
check_3d_bounds: True
check_projection_bounds: True

### metrics ###
metric: ['euclidean_distance_3D']

### data augmentation ###      
medfilt_window: 30
rand_view_replace: True
n_rand_views: 6
mirror_augmentation: False
left_keypoints: [1, 7, 8, 9, 10, 15, 16, 17, 18]
right_keypoints: [2, 11, 12, 13, 14, 19, 20, 21, 22]

augment_hue: False
augment_brightness: False
augment_bright_val: 0.01

### predictions ###
max_num_samples: max